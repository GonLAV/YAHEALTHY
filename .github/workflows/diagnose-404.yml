name: One-off - Fix Vercel project Root Directory

# ROOT CAUSE CONFIRMED (see git history / PR discussion): this Vercel
# project has its OWN native GitHub integration (project.link.type ==
# "github", productionBranch "main"), completely separate from this repo's
# deploy.yml. It auto-deploys AND auto-promotes to production on every push
# to main, using the dashboard's Root Directory setting -- which the API
# shows as null (repo root). A repo-root build has no api/ directory, so
# every one of those deployments 404s on every route, and because it's a
# `source: "git"` deployment that lands after our own `source: "cli"`
# deploy (which correctly uses --cwd YAHEALTHYbackend), it wins the
# production alias race and silently reverts every fix. Confirmed via
# `GET /v6/deployments?projectId=...&target=production`: the git-sourced
# deployment for commit 06b91fb (which touched nothing under
# YAHEALTHYbackend/) still redeployed and re-aliased yahealthy.vercel.app,
# 404ing it, less than a minute after our CI's deploy had correctly aliased
# it with a working build.
#
# Fix: set the project's rootDirectory to YAHEALTHYbackend via the Vercel
# API, so BOTH deploy paths (Vercel's own git integration and this repo's
# CI) build from the same place and produce the same working output. This
# changes a project setting only -- it does not itself deploy anything.
on:
  workflow_dispatch: {}

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Show current rootDirectory (before)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID" \
            | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{const p=JSON.parse(d);console.log('before rootDirectory:', p.rootDirectory)})"

      - name: Set rootDirectory to YAHEALTHYbackend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          curl -s -X PATCH -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID" \
            -d '{"rootDirectory":"YAHEALTHYbackend"}' \
            | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{const p=JSON.parse(d);console.log('after rootDirectory:', p.rootDirectory)})"
