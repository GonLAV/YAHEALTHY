services:
  backend:
    image: node:22
    working_dir: /app/YAHEALTHYbackend
    volumes:
      - ./:/app
      - backend_node_modules:/app/YAHEALTHYbackend/node_modules
    environment:
      - PORT=5000
      - NODE_ENV=development
      - ALLOW_MEMORY_DB=true
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    command: sh -c "npm install && npx nodemon index.js"
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    image: node:22
    working_dir: /app/YAHEALTHYFrontend
    volumes:
      - ./:/app
      - frontend_node_modules:/app/YAHEALTHYFrontend/node_modules
    environment:
      - VITE_PROXY_TARGET=http://backend:5000
      - VITE_API_URL=
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command: sh -c "npm install && npx vite --host 0.0.0.0 --port 5173"
    ports:
      - "3000:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_node_modules:
  frontend_node_modules:
