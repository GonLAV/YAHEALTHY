name: One-off - Set CORS_ORIGINS on Vercel

# ONE-TIME PROVISIONING, NOT A DEPLOY STEP.
#
# Production (https://yahealthy.vercel.app) is down with
# FUNCTION_INVOCATION_FAILED because YAHEALTHYbackend/index.js refuses to
# start in production without CORS_ORIGINS set, and that var was never added
# to the Vercel project. This workflow adds it, once, via the Vercel CLI,
# using the VERCEL_TOKEN/VERCEL_PROJECT_ID/VERCEL_ORG_ID secrets that
# deploy.yml already has. It is deliberately manual-trigger-only and is meant
# to be deleted again once the env var is confirmed present -- it must not
# stick around as a way to silently reset project env vars later.
#
# CORS_ORIGINS itself is not sensitive: its value is just the app's own
# public URL, so it is safe to reference directly here. Nothing else is
# provisioned by this workflow.
on:
  workflow_dispatch: {}

jobs:
  set-cors-origins:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      CORS_ORIGINS_VALUE: https://yahealthy.vercel.app

    steps:
      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Check whether CORS_ORIGINS is already set in production
        id: check
        working-directory: YAHEALTHYbackend
        run: |
          set -e
          vercel env ls production --token="$VERCEL_TOKEN" --json > env-list.json
          if grep -q '"key":[[:space:]]*"CORS_ORIGINS"' env-list.json; then
            echo "already_set=true" >> "$GITHUB_OUTPUT"
            echo "CORS_ORIGINS is already set in production; leaving it alone."
          else
            echo "already_set=false" >> "$GITHUB_OUTPUT"
            echo "CORS_ORIGINS is not set in production."
          fi

      - name: Add CORS_ORIGINS to production
        if: steps.check.outputs.already_set == 'false'
        working-directory: YAHEALTHYbackend
        run: |
          set -e
          vercel env add CORS_ORIGINS production --value "$CORS_ORIGINS_VALUE" --token="$VERCEL_TOKEN" --yes
          echo "Added CORS_ORIGINS=$CORS_ORIGINS_VALUE to production."

      - name: Summary
        run: |
          echo "### CORS_ORIGINS provisioning" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.check.outputs.already_set }}" = "true" ]; then
            echo "CORS_ORIGINS was already set in production. No change made." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "CORS_ORIGINS was missing and has been added to production." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "A fresh deploy (deploy.yml) is still required for the running function to pick this up." >> "$GITHUB_STEP_SUMMARY"
          fi
