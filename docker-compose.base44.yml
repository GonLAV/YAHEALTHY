services:
  backend:
    image: node:22-slim
    working_dir: /app/YAHEALTHYbackend
    volumes:
      - ./:/app
    environment:
      - NODE_ENV=development
      - PORT=5000
      # In-memory DB: no Supabase needed to boot. Data resets on restart.
      - ALLOW_MEMORY_DB=true
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    image: node:22-slim
    working_dir: /app/YAHEALTHYFrontend
    volumes:
      - ./:/app
    ports:
      - "3000:5173"
    environment:
      # Backend reachable on the compose network by service name.
      - API_PROXY_TARGET=http://backend:5000
      # Lets the preview's external hostname reach the Vite dev server.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    depends_on:
      backend:
        condition: service_healthy
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
