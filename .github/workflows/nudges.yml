name: Reminders (hourly)

# Water / breakfast / today's-menu / well-done reminders (YAHEALTHYbackend/utils/nudges.js).
# Vercel's Hobby plan runs its own crons once a day at most, so the hourly tick
# comes from here. Each run sends only what is due in that Israel hour, and a
# repeated run sends nothing twice (the nudges table dedupes).
#
# Needs two repository secrets:
#   API_URL      the backend's public URL, e.g. https://api.example.com
#   CRON_SECRET  the same value as CRON_SECRET in the backend's environment
# Until both exist this job does nothing and says so.

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch: {}

concurrency:
  group: nudges
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run the reminder job
        env:
          API_URL: ${{ secrets.API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "API_URL or CRON_SECRET is not set as a repository secret — skipping."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$API_URL/api/cron/nudges"
