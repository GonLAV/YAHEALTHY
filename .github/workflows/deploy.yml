name: Deploy YAHEALTHY Backend

# Only deploys. Tests live in ci.yml, which runs on every push and pull request —
# this workflow used to duplicate a weaker version of them on the same triggers,
# with a different Node version, so what was tested was not what shipped.
on:
  push:
    branches: [ main ]
    paths:
      - 'YAHEALTHYbackend/**'
      - '.github/workflows/deploy.yml'
  # Lets a deploy be tested against a feature branch before it merges to
  # main, from the Actions tab or the API -- same job, explicit trigger.
  workflow_dispatch: {}

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: YAHEALTHYbackend/package-lock.json

      - name: Install dependencies
        working-directory: YAHEALTHYbackend
        run: npm ci

      # `node -c` only parses index.js itself, not the modules it requires --
      # a syntax error in utils/database.js (two functions left unclosed by a
      # bad merge) passed this check and then crashed every single request in
      # production instead. Actually require() the app so the whole
      # dependency tree gets parsed and its module-level code runs.
      - name: Syntax check
        working-directory: YAHEALTHYbackend
        env:
          ALLOW_MEMORY_DB: 'true'
        run: node -e "require('./index.js'); process.exit(0);"

      # The server refuses to start without these. Checking here turns a silent
      # production failure into a red build before anything ships.
      - name: Verify required secrets are present
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          missing=""
          for name in JWT_SECRET SUPABASE_URL SUPABASE_KEY VERCEL_TOKEN; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required repository secrets:$missing"
            echo "Add them under Settings -> Secrets and variables -> Actions."
            echo "Without JWT_SECRET the server would sign tokens with a predictable key;"
            echo "without SUPABASE_* it would lose all user data on every restart."
            exit 1
          fi
          echo "All required secrets are present."

      # No continue-on-error here on purpose: a failed deploy must fail the run.
      # The previous version let this step fail and still reported success.
      - name: Deploy to Vercel
        id: vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          npm i -g vercel@latest
          # --cwd, not the dashboard's "Root Directory" setting: a token-based
          # `vercel deploy` from CI doesn't apply that setting, so relying on
          # it silently deployed the repo root -- no api/ there, every route
          # 404'd even though the build itself "succeeded".
          url=$(vercel --cwd YAHEALTHYbackend --token "$VERCEL_TOKEN" --prod --yes)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url"

      # Diagnostic only -- a test POST to /api/whapi/webhook returns 200 but
      # nothing lands in Supabase. Remove once it's fixed.
      - name: Print the webhook handler's actual error
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          curl -s -o /dev/null -X POST "${{ steps.vercel.outputs.url }}/api/whapi/webhook" \
            -H "Content-Type: application/json" \
            -d '{"messages":[{"id":"ci-diag-1","from_me":false,"type":"text","chat_id":"972500000002@s.whatsapp.net","from":"972500000002","text":{"body":"בדיקה"}}]}' \
            || true
          sleep 8
          timeout 25 vercel logs "${{ steps.vercel.outputs.url }}" --token "$VERCEL_TOKEN" || true

      - name: Summary
        if: success()
        run: |
          echo "### Deployment successful" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Backend URL: ${{ steps.vercel.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
