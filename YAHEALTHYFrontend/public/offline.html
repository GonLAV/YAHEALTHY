<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#059669" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <title>YAHealthy — אין חיבור · Offline</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        padding: 16px; background: #f8fafc; color: #0f172a;
        font-family: 'Heebo', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      main { width: 100%; max-width: 420px; background: #fff; border-radius: 24px; padding: 32px 24px;
        box-shadow: 0 1px 3px rgba(15, 23, 42, .08); text-align: center; }
      .logo { width: 64px; height: 64px; margin: 0 auto 16px; }
      h1 { font-size: 1.35rem; margin: 0 0 8px; }
      p { margin: 0 0 12px; color: #475569; line-height: 1.6; }
      section + section { margin-top: 20px; padding-top: 20px; border-top: 1px solid #e2e8f0; }
      button { margin-top: 20px; border: 0; border-radius: 9999px; background: #059669; color: #fff;
        font: inherit; font-weight: 600; padding: 12px 24px; cursor: pointer; }
      button:hover { background: #047857; }
      :focus-visible { outline: 2px solid #059669; outline-offset: 2px; }
      @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
    </style>
  </head>
  <body>
    <main>
      <img class="logo" src="/icons/icon.svg" alt="" width="64" height="64" />
      <section lang="he" dir="rtl" id="he">
        <h1>אין חיבור לאינטרנט</h1>
        <p>לא הצלחנו לטעון את YAHealthy. הנתונים שלכם שמורים — נסו שוב כשהחיבור יחזור.</p>
      </section>
      <section lang="en" dir="ltr" id="en">
        <h1>You're offline</h1>
        <p>YAHealthy couldn't load. Your data is safe — try again once you're back online.</p>
      </section>
      <button type="button" id="retry">נסו שוב · Try again</button>
      <p role="status" aria-live="polite" id="status" style="margin-top:12px;font-size:.875rem"></p>
    </main>
    <script>
      // Put the reader's own language first (same key the app uses).
      try {
        if (localStorage.getItem('yahealthy-lang') === 'en') {
          var main = document.querySelector('main');
          main.insertBefore(document.getElementById('en'), document.getElementById('he'));
          document.documentElement.lang = 'en';
          document.documentElement.dir = 'ltr';
          document.getElementById('retry').textContent = 'Try again · נסו שוב';
        }
      } catch (e) { /* storage blocked: Hebrew first */ }
      document.getElementById('retry').addEventListener('click', function () {
        if (navigator.onLine) location.reload();
        else document.getElementById('status').textContent = 'עדיין אין חיבור · Still offline';
      });
      window.addEventListener('online', function () { location.reload(); });
    </script>
  </body>
</html>
