services:
  backend:
    image: node:22
    container_name: yahealthy-backend
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npx nodemon index.js"
    volumes:
      - ./YAHEALTHYbackend:/app
      - backend_node_modules:/app/node_modules
    environment:
      - PORT=5000
      - NODE_ENV=development
      - ALLOW_MEMORY_DB=true
      - CHOKIDAR_USEPOLLING=true
    env_file:
      - /run/base44/app.env
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s

  frontend:
    image: node:22
    container_name: yahealthy-frontend
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npx vite --host 0.0.0.0 --port 5173"
    volumes:
      - ./YAHEALTHYFrontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_PROXY_TARGET=http://backend:5000
      - VITE_API_URL=
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - BASE44_PUBLIC_HOST_SUFFIX
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_node_modules: {}
  frontend_node_modules: {}
